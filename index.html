<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SEO -->
    <title>KangsikWoo's portfolio</title>
    <meta name="description" content="Portfolio" />
    <link rel="shortcut icon" href="images/favicon.ico" />
    <!-- OG (Open Graph Data) : sns로 사이트 링크를 공유하면 웹사이트 이미지가 자동으로 나옴. -->
    <meta property="og:title" content="강식의 포토폴리오" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="배포 후 생성된 url" />
    <meta property="og:image" content="배포 후 이미지" />
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
      rel="stylesheet"
    />
    <!-- icon -->
    <script src="https://kit.fontawesome.com/96c357534c.js" crossorigin="anonymous"></script>
    <!-- CSS -->
    <link rel="stylesheet" href="CSS/style.css" />
    <!-- JS -->
    <!-- defer : js파일이 다운로드 될 때까지 안 기다려도 됨. 성능 좋아짐. -->
    <script src="src/main.js" defer></script>
  </head>
  <body>
    <!-- Header -->
    <header>
      <div>
        <img src="images/favicon.ico" alt="logo" />
        <h1><a href="#">Kangsik</a></h1>
      </div>
      <nav>
        <ul>
          <li><a href="#home">Home</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#skill">Skill</a></li>
          <li><a href="#testimonial">Testimonial</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>
    <!-- Main -->
    <main>
      <!-- Home -->
      <section id="home"></section>
      <!-- About -->
      <section id="about"></section>
      <!-- Skill -->
      <section id="skill"></section>
      <!-- Work -->
      <section id="work"></section>
      <!-- Testimonials -->
      <section id="testimonial"></section>
      <!-- Arrow Up -->
      <aside></aside>
    </main>
    <!-- Footer -->
    <footer id="contact"></footer>
  </body>
</html>
